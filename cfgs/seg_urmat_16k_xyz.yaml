# 材质单任务「无颜色」消融：只做 UR-MAT 14 类材质，输入只有 XYZ（3 通道）。
# 与 cfgs/seg_urmat_16k.yaml 严格配对（同 16384 点 / ng64 / bs 16 / 200 epoch / CosLR），
# 唯一差别是 in_channels 6 → 3。动机：scripts/material_modality_probe.py 实测颜色对材质的
# 判别增益是随机的 3.2–3.6×（对语义只有 1.7×），本组用学习模型检验该结论是否变现为 mIoU。
optimizer: {
  type: AdamW,
  kwargs: { lr: 0.001, weight_decay: 0.05 }
}
scheduler: {
  type: CosLR,
  kwargs: { epochs: 200, initial_epochs: 5 }
}
dataset: {
  train: { _base_: cfgs/dataset_configs/UrmatSeg16kXYZ.yaml, others: { subset: 'train' } },
  val:   { _base_: cfgs/dataset_configs/UrmatSeg16kXYZ.yaml, others: { subset: 'val' } },
  test:  { _base_: cfgs/dataset_configs/UrmatSeg16kXYZ.yaml, others: { subset: 'val' } }
}
model: {
  NAME: PointMambaSeg, trans_dim: 384, depth: 12,
  group_size: 32, num_group: 64, encoder_dims: 384,
  in_channels: 3, num_classes: 14, num_materials: 0, upsample_k: 3,
  rms_norm: False, drop_path: 0.1, drop_out: 0.0,
}
npoints: 16384
total_bs: 16
step_per_update: 1
max_epoch: 200
grad_norm_clip: 10
