optimizer: {
  type: AdamW,
  kwargs: { lr: 0.001, weight_decay: 0.05 }
}

scheduler: {
  type: CosLR,
  kwargs: { epochs: 200, initial_epochs: 5 }
}

dataset: {
  train: { _base_: cfgs/dataset_configs/RealColor.yaml, others: { subset: 'train' } },
  val:   { _base_: cfgs/dataset_configs/RealColor.yaml, others: { subset: 'test' } },
  test:  { _base_: cfgs/dataset_configs/RealColor.yaml, others: { subset: 'test' } }
}

model: {
  NAME: PointMambaScan,
  trans_dim: 384, depth: 12, cls_dim: 3,
  num_heads: 6, group_size: 32, num_group: 64, encoder_dims: 384,
  in_channels: 6, rms_norm: False,
  drop_path: 0.1, drop_out: 0.0,
  use_cls_token: False, max_head: False, avg_head: True,
}

npoints: 1024
total_bs: 8
step_per_update: 1
max_epoch: 200
grad_norm_clip: 10
