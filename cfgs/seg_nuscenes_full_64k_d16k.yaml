# 方案1 + 方案B 合并：64k（npoints=32768）+ g1024 grid（token 数扩到 1024）。
# 依据 #82：g1024@16k best mIoU 0.3667 已反超 g256@16k 0.3090，token 数是瓶颈；
# GridGroup 为 O(N) 分组，规模化到 32768 点无 FPS+KNN 的 O(B*G*N) 距离矩阵墙。
# 与 seg_nuscenes_grid_g1024.yaml 唯一区别：npoints 16384 -> 32768 + 数据集换 64k。
# 数据：每帧 ~34.7k 点，N_POINTS=32768 时 100% 随机子采样（0 padding）。
optimizer: {
  type: AdamW,
  kwargs: { lr: 0.001, weight_decay: 0.05 }
}
scheduler: {
  type: CosLR,
  kwargs: { epochs: 200, initial_epochs: 5 }
}
dataset: {
  train: { _base_: cfgs/dataset_configs/NuscenesSegFull64k_d16k.yaml, others: { subset: 'train' } },
  val:   { _base_: cfgs/dataset_configs/NuscenesSegFull64k_d16k.yaml, others: { subset: 'val' } },
  test:  { _base_: cfgs/dataset_configs/NuscenesSegFull64k_d16k.yaml, others: { subset: 'val' } }
}
model: {
  NAME: PointMambaSeg, trans_dim: 384, depth: 12,
  group_size: 32, num_group: 1024, encoder_dims: 384,
  in_channels: 6, num_classes: 32, upsample_k: 3,
  use_grid_group: True, grid_size: 0.5,
  rms_norm: False, drop_path: 0.1, drop_out: 0.0,
}
npoints: 16384
# 本机 5070 Ti (15.45GB) bs=16 实测 14.8GB 峰值 + 碎片化 -> OOM；降 bs=12 留 ~4GB 余量。
# 迁回 4090(24GB) 后可改回 16。
total_bs: 12
step_per_update: 1
max_epoch: 200
grad_norm_clip: 10
