# 方案1：固定 npoints=32768（数据集重建到 ~34.7k/帧，N>32768 由 __getitem__ 随机子采样）。
# 与 seg_nuscenes_full_16k_g256.yaml 唯一区别：npoints 16384 -> 32768（token 数保持 256）。
# 目的：隔离"点密度"效应——在 token 数不变的前提下把每帧输入点数翻倍，看 mIoU 能否
#       越过 16k g256 的 0.3090。
# 内存：FPS+KNN 距离矩阵 O(B x G x N) = 16 x 256 x 32768 = 537MB（16k 为 268MB），
#       upsample KNN 另 ~537MB；4090(24GB) 可承受。若 OOM 可降 total_bs 或换 g1024 grid。
optimizer: {
  type: AdamW,
  kwargs: { lr: 0.001, weight_decay: 0.05 }
}
scheduler: {
  type: CosLR,
  kwargs: { epochs: 200, initial_epochs: 5 }
}
dataset: {
  train: { _base_: cfgs/dataset_configs/NuscenesSegFull64k.yaml, others: { subset: 'train' } },
  val:   { _base_: cfgs/dataset_configs/NuscenesSegFull64k.yaml, others: { subset: 'val' } },
  test:  { _base_: cfgs/dataset_configs/NuscenesSegFull64k.yaml, others: { subset: 'val' } }
}
model: {
  NAME: PointMambaSeg, trans_dim: 384, depth: 12,
  group_size: 32, num_group: 256, encoder_dims: 384,
  in_channels: 6, num_classes: 32, upsample_k: 3,
  rms_norm: False, drop_path: 0.1, drop_out: 0.0,
}
npoints: 32768
total_bs: 16
step_per_update: 1
max_epoch: 200
grad_norm_clip: 10
