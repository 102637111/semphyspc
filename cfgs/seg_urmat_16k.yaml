# 单任务材质分割基线：只做 UR-MAT 14 类材质，无语义头
# 用途：与多任务(材质头 0.31)对比，量化多任务负迁移对材质任务的代价
optimizer: {
  type: AdamW,
  kwargs: { lr: 0.001, weight_decay: 0.05 }
}
scheduler: {
  type: CosLR,
  kwargs: { epochs: 200, initial_epochs: 5 }
}
dataset: {
  train: { _base_: cfgs/dataset_configs/UrmatSeg16k.yaml, others: { subset: 'train' } },
  val:   { _base_: cfgs/dataset_configs/UrmatSeg16k.yaml, others: { subset: 'val' } },
  test:  { _base_: cfgs/dataset_configs/UrmatSeg16k.yaml, others: { subset: 'val' } }
}
model: {
  NAME: PointMambaSeg, trans_dim: 384, depth: 12,
  group_size: 32, num_group: 64, encoder_dims: 384,
  in_channels: 6, num_classes: 14, num_materials: 0, upsample_k: 3,
  rms_norm: False, drop_path: 0.1, drop_out: 0.0,
}
npoints: 16384
total_bs: 16
step_per_update: 1
max_epoch: 200
grad_norm_clip: 10
