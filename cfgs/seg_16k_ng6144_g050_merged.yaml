# 合并相似类：nuScenes 32 类 → 12 类（物理交互粗粒度）。
# 与 baseline seg_16k_ng6144_g050.yaml（mIoU 0.4077，32 类）唯一区别：
#   dataset 换成 NuscenesSegFull16kMerged.yaml（CLASS_MAP 32→12）
#   model.num_classes: 32 -> 12
# 其余（16k 点 / grid 0.5 / num_group 6144 / group_size 32 / bs2 / step_per_update 4 / 40 epoch）
# 完全一致，隔离「类别合并」这一个变量。
optimizer: {
  type: AdamW,
  kwargs: { lr: 0.001, weight_decay: 0.05 }
}
scheduler: {
  type: CosLR,
  kwargs: { epochs: 40, initial_epochs: 5 }
}
dataset: {
  train: { _base_: cfgs/dataset_configs/NuscenesSegFull16kMerged.yaml, others: { subset: 'train' } },
  val:   { _base_: cfgs/dataset_configs/NuscenesSegFull16kMerged.yaml, others: { subset: 'val' } },
  test:  { _base_: cfgs/dataset_configs/NuscenesSegFull16kMerged.yaml, others: { subset: 'val' } }
}
model: {
  NAME: PointMambaSeg, trans_dim: 384, depth: 12,
  group_size: 32, num_group: 6144, encoder_dims: 384,
  in_channels: 6, num_classes: 12, upsample_k: 3,
  use_grid_group: True, grid_size: 0.5,
  rms_norm: False, drop_path: 0.1, drop_out: 0.0,
}
npoints: 16384
total_bs: 2
step_per_update: 4
max_epoch: 40
grad_norm_clip: 10
