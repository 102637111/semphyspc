# 阶段一：射线几何旁路（方案 A 盲区特征接 PointMamba）1-epoch 冒烟。
# 与 seg_16k_ng6144_g050_merged.yaml（基线）唯一区别：
#   dataset: RAY_FEATURE=True（追加第 7 通道盲区邻接）+ NO_ROT_AUG=True（关 yaw 增强，保特征与几何一致）
#   model:   use_ray_feature=True（第 7 通道剥出走 ray_branch，主干仍 6 通道 XYZ+RGB）
# 对照 = seg_16k_ng6144_g050_merged_noaug_smoke.yaml（同样 NO_ROT_AUG 的 6 通道基线），隔离「射线特征」单变量。
optimizer: {
  type: AdamW,
  kwargs: { lr: 0.001, weight_decay: 0.05 }
}
scheduler: {
  type: CosLR,
  kwargs: { epochs: 40, initial_epochs: 5 }
}
dataset: {
  train: { _base_: cfgs/dataset_configs/NuscenesSegFull16kMerged.yaml, others: { subset: 'train', RAY_FEATURE: True, NO_ROT_AUG: True } },
  val:   { _base_: cfgs/dataset_configs/NuscenesSegFull16kMerged.yaml, others: { subset: 'val', RAY_FEATURE: True, NO_ROT_AUG: True } },
  test:  { _base_: cfgs/dataset_configs/NuscenesSegFull16kMerged.yaml, others: { subset: 'val', RAY_FEATURE: True, NO_ROT_AUG: True } }
}
model: {
  NAME: PointMambaSeg, trans_dim: 384, depth: 12,
  group_size: 32, num_group: 6144, encoder_dims: 384,
  in_channels: 6, num_classes: 12, upsample_k: 3,
  use_grid_group: True, grid_size: 0.5,
  rms_norm: False, drop_path: 0.1, drop_out: 0.0,
  use_ray_feature: True, ray_dim: 128,
}
npoints: 16384
total_bs: 2
step_per_update: 4
max_epoch: 1
grad_norm_clip: 10
