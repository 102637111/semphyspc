# 阶段一：射线几何旁路的对照基线（6 通道 + NO_ROT_AUG）全量 40 epoch。
# 与 seg_16k_ng6144_g050_merged.yaml（基线）唯一区别：NO_ROT_AUG=True（关 yaw 增强）。
# 因为射线特征按原始朝向离线算，随机 yaw 会使其与旋转后几何失配，故 ray 版必须关 yaw；
# 本基线同样关 yaw，这样与 ray 版（seg_16k_ng6144_g050_merged_ray.yaml）唯一差异就是「第 7 通道 + ray_branch」。
optimizer: {
  type: AdamW,
  kwargs: { lr: 0.001, weight_decay: 0.05 }
}
scheduler: {
  type: CosLR,
  kwargs: { epochs: 40, initial_epochs: 5 }
}
dataset: {
  train: { _base_: cfgs/dataset_configs/NuscenesSegFull16kMerged.yaml, others: { subset: 'train', NO_ROT_AUG: True } },
  val:   { _base_: cfgs/dataset_configs/NuscenesSegFull16kMerged.yaml, others: { subset: 'val', NO_ROT_AUG: True } },
  test:  { _base_: cfgs/dataset_configs/NuscenesSegFull16kMerged.yaml, others: { subset: 'val', NO_ROT_AUG: True } }
}
model: {
  NAME: PointMambaSeg, trans_dim: 384, depth: 12,
  group_size: 32, num_group: 6144, encoder_dims: 384,
  in_channels: 6, num_classes: 12, upsample_k: 3,
  use_grid_group: True, grid_size: 0.5,
  rms_norm: False, drop_path: 0.1, drop_out: 0.0,
}
npoints: 16384
total_bs: 2
step_per_update: 4
max_epoch: 40
grad_norm_clip: 10
