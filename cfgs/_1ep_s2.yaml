# 阶段一 S2：merged 12 类 PointMamba（GridGroup ng6144）+ 局部几何旁路
#         + offset 实例头 + 边界头（联合训练）。
# 在 S1（geom）基础上叠加 num_instances=3（offset 回归）+ num_boundary=1（边界 BCE），
# 由 run_net_s1 联合训练：loss = sem_w·CE + offset_w·SmoothL1 + boundary_w·BCE。
# 语义 mIoU 仍是主指标。dataset 通过 NEED_INST/NEED_BOUNDARY 额外返回 inst/offset/boundary。
#
# 前置：先运行 scripts/build_boundary_label.py 生成 is_boundary。
# 边界标签用原始 32 类 (sem, inst) 联合键（inst 跨类复用，实例身份与语义合并无关）。
optimizer: {
  type: AdamW,
  kwargs: { lr: 0.001, weight_decay: 0.05 }
}
scheduler: {
  type: CosLR,
  kwargs: { epochs: 40, initial_epochs: 5 }
}
dataset: {
  train: { _base_: cfgs/dataset_configs/NuscenesSegFull16kMerged.yaml, others: { subset: 'train', NEED_INST: True, NEED_BOUNDARY: True } },
  val:   { _base_: cfgs/dataset_configs/NuscenesSegFull16kMerged.yaml, others: { subset: 'val', NEED_INST: True, NEED_BOUNDARY: True } },
  test:  { _base_: cfgs/dataset_configs/NuscenesSegFull16kMerged.yaml, others: { subset: 'val', NEED_INST: True, NEED_BOUNDARY: True } }
}
model: {
  NAME: PointMambaSeg, trans_dim: 384, depth: 12,
  group_size: 32, num_group: 6144, encoder_dims: 384,
  in_channels: 6, num_classes: 12, upsample_k: 3,
  use_grid_group: True, grid_size: 0.5,
  rms_norm: False, drop_path: 0.1, drop_out: 0.0,
  use_local_geom: True, geom_radius: 0.5, geom_nsample: 32, geom_dim: 128,
  num_instances: 3, num_boundary: 1, boundary_pos_weight: 10.0,
}
npoints: 16384
total_bs: 2
step_per_update: 4
max_epoch: 1
grad_norm_clip: 10
# 阶段一多任务调度开关 + 损失权重旋钮
stage1_multitask: True
sem_loss_weight: 1.0
offset_loss_weight: 1.0
boundary_loss_weight: 1.0
