# C⑤ 公平基线之二：PointTransformer（Zhao et al. ICCV 2021）逐点语义分割，12 类合并体系。
# 与 PointMamba 的 merged 基线（mIoU 0.6132）在「同一数据协议」下对比：
# 16k 点 / 6 通道 / 12 类 / AdamW lr0.001 wd0.05 / CosLR 40ep(5warmup) / total_bs 2 /
# step_per_update 4 / grad_norm_clip 10，仅换 backbone（PointMamba -> PointTransformer）。
# 模型 5 层 enc_dims [32,64,128,256,512]，npoints [4096,1024,256,64]，每层 2 个 block，k=16。
optimizer: {
  type: AdamW,
  kwargs: { lr: 0.001, weight_decay: 0.05 }
}
scheduler: {
  type: CosLR,
  kwargs: { epochs: 40, initial_epochs: 5 }
}
dataset: {
  train: { _base_: cfgs/dataset_configs/NuscenesSegFull16kMerged.yaml, others: { subset: 'train' } },
  val:   { _base_: cfgs/dataset_configs/NuscenesSegFull16kMerged.yaml, others: { subset: 'val' } },
  test:  { _base_: cfgs/dataset_configs/NuscenesSegFull16kMerged.yaml, others: { subset: 'val' } }
}
model: {
  NAME: PointTransformerSeg, in_channels: 6, num_classes: 12,
  pt_dims: [32, 64, 128, 256, 512], pt_npoints: [4096, 1024, 256, 64],
  pt_blocks: [2, 2, 2, 2], pt_k: 16,
}
npoints: 16384
total_bs: 2
step_per_update: 4
max_epoch: 40
grad_norm_clip: 10
